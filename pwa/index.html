<!doctype html>
<html lang="en" data-platform="pwa" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6750a4">
  <meta name="description" content="Track Microsoft Power Platform and Microsoft 365 release updates.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PPAC Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header class="app-bar">
      <span class="brand-icon" aria-hidden="true"><img src="icons/icon-48.png" alt=""></span>
      <div class="app-title-block">
        <strong id="app-title">PPAC Tracker</strong>
        <small id="sync-label">Not synced yet</small>
      </div>
      <button id="top-action" class="icon-button" type="button" hidden></button>
    </header>
    <div id="sync-progress" class="sync-progress" role="progressbar" aria-label="Syncing" hidden></div>
    <div id="error-banner" class="error-banner" role="alert" hidden></div>
    <main id="app-content" class="app-content"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root" class="modal-root" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
